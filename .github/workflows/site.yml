name: Refresh internships and publish website

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh-and-deploy:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh internship listings
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python scripts/update_jobs.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Keep scheduled workflow active
        if: github.event_name == 'schedule'
        run: |
          git restore index.html
          mkdir -p data
          date -u +%Y-%m > data/schedule-heartbeat.txt
          git config user.name "internship-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/schedule-heartbeat.txt
          if ! git diff --cached --quiet; then
            git commit -m "Keep internship updater active [skip ci]"
            git pull --rebase origin main
            git push
          fi
